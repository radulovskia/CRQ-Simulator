apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crq
  namespace: crq
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /mc
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
