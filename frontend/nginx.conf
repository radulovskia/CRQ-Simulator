server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate static assets so UI updates are never served from a stale browser cache.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /monte-carlo {
        try_files /monte-carlo.html =404;
    }

    location = /result {
        try_files /result.html =404;
    }

    location = /asset-inventory {
        try_files /asset-inventory.html =404;
    }

    location = /vulnerability-database {
        try_files /vulnerability-database.html =404;
    }

    location = /business-processes {
        try_files /business-processes.html =404;
    }

    location = /organisational-units {
        try_files /organisational-units.html =404;
    }

    location = /software-systems {
        try_files /software-systems.html =404;
    }

    location /mc {
        proxy_pass http://backend:8000/mc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location = /vulnerabilities {
        proxy_pass http://backend:8000/vulnerabilities;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /inventory {
        client_max_body_size 10m;
        proxy_pass http://backend:8000/inventory;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /processes {
        client_max_body_size 10m;
        proxy_pass http://backend:8000/processes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /processes/entry {
        proxy_pass http://backend:8000/processes/entry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /units {
        client_max_body_size 10m;
        proxy_pass http://backend:8000/units;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /units/entry {
        proxy_pass http://backend:8000/units/entry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /systems {
        client_max_body_size 10m;
        proxy_pass http://backend:8000/systems;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /systems/entry {
        proxy_pass http://backend:8000/systems/entry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
