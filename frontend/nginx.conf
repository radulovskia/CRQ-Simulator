server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate static assets so UI updates are never served from a stale browser cache.
    add_header Cache-Control "no-cache" always;

    # Static files under /css and /js are served from disk, ahead of API prefixes such as /actors.
    location ~* \.(?:js|css|map|png|svg|ico|webp)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /risk-simulation {
        try_files /pages/risk/monte-carlo.html =404;
    }

    location = /monte-carlo {
        return 301 $scheme://$http_host/risk-simulation;
    }

    location = /result {
        try_files /pages/risk/result.html =404;
    }

    location = /software-components {
        try_files /pages/inventory/component-inventory.html =404;
    }

    location = /component-inventory {
        return 301 $scheme://$http_host/software-components;
    }

    location = /vulnerability-database {
        try_files /pages/intelligence/vulnerability-database.html =404;
    }

    location = /business-processes {
        try_files /pages/inventory/business-processes.html =404;
    }

    location = /organisational-units {
        try_files /pages/inventory/organisational-units.html =404;
    }

    location = /software-systems {
        try_files /pages/inventory/software-systems.html =404;
    }

    location = /threat-actors {
        try_files /pages/intelligence/threat-actors.html =404;
    }

    location = /attack-vectors {
        try_files /pages/intelligence/attack-vectors.html =404;
    }

    location = /control-catalog {
        try_files /pages/risk/control-catalog.html =404;
    }

    location = /scenario-control-mapping {
        try_files /pages/risk/scenario-control-mapping.html =404;
    }

    location = /risk-scenarios {
        try_files /pages/risk/risk-scenarios.html =404;
    }

    location = /risk-register {
        try_files /pages/risk/risk-register.html =404;
    }

    location = /decision-log {
        try_files /pages/risk/decision-log.html =404;
    }

    location = /mitre-attack {
        try_files /pages/intelligence/mitre-attack.html =404;
    }

    location = /settings {
        try_files /pages/settings/benchmarks.html =404;
    }

    location /mc {
        proxy_pass http://backend:8000/mc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /mitre/ {
        proxy_pass http://backend:8000/mitre/;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /vulnerabilities {
        proxy_pass http://backend:8000/vulnerabilities;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /inventory {
        client_max_body_size 10m;
        proxy_pass http://backend:8000/inventory;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /processes {
        client_max_body_size 10m;
        proxy_pass http://backend:8000/processes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /processes/entry {
        proxy_pass http://backend:8000/processes/entry;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /units {
